name: Deploy documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: pip install mkdocs-material mkdocs-glightbox

      - name: Build docs
        run: mkdocs build

      # Fetch the existing gh-pages branch so Kodi addon files at the root are
      # preserved when we update only the /docs/ subdirectory.
      - name: Fetch existing GitHub Pages content
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages

      - name: Merge docs into Pages site
        run: |
          rm -rf pages/docs
          mkdir -p pages/docs
          cp -r site/. pages/docs/
          touch pages/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      # peaceiris/actions-gh-pages only pushes to the gh-pages branch; it does
      # not publish when Pages build_type is "workflow". deploy-pages publishes
      # the artifact to the live site.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Update gh-pages branch
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "deploy docs: ${{ github.sha }}"
          git push origin HEAD:gh-pages
